<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraX Digital Library Management System - Dashboard">
  <title>Dashboard | LibraX Digital Library</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#f8fafc] min-h-screen text-slate-900">
  <div class="flex min-h-screen">

    <!-- Clean Minimalist Sidebar -->
    <aside id="sidebar" class="sidebar flex-shrink-0 fixed lg:sticky top-0 h-screen overflow-y-auto z-40 flex flex-col justify-between p-3">
      <div>
        <!-- Brand Header -->
        <div class="px-2 py-3 mb-2 border-b border-zinc-100">
          <div class="flex items-center gap-2.5">
            <img src="./assets/images/logo-icon.png" alt="LibraX" class="w-10 h-10 rounded-lg object-contain border border-zinc-200/80 bg-white p-1.5 shadow-xs">
            <div>
              <h1 class="text-sm font-bold text-zinc-900 tracking-tight leading-none">LibraX</h1>
              <span class="text-xs text-zinc-400 font-medium">Digital Library</span>
            </div>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="space-y-0.5">
          <a href="./index.html" class="sidebar-link active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
          </a>
          <a href="./pages/books.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            Books
          </a>
          <a href="./pages/members.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Members
          </a>
          <a href="./pages/borrow.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            Borrow & Return
          </a>
          <a href="./pages/history.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            History
          </a>
        </nav>
      </div>

      <!-- Minimal Status Indicator -->
      <div class="px-3 py-2 rounded-md bg-emerald-50/70 border border-emerald-200/70 text-xs text-emerald-800">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="font-medium text-emerald-700">Library Online</span>
        </div>
      </div>
    </aside>

    <!-- Mobile Overlay -->
    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/20 z-30 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col min-w-0">
      <!-- Slim Top Header -->
      <header class="bg-white border-b border-zinc-200/80 px-6 h-[50px] flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button class="lg:hidden p-1 rounded hover:bg-zinc-100 text-zinc-500" onclick="toggleSidebar()">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h2 class="text-sm font-semibold text-zinc-900 tracking-tight">Overview Dashboard</h2>
        </div>
        <div class="flex items-center gap-2">
          <a href="./pages/borrow.html" class="btn btn-primary btn-sm">
            + New Loan
          </a>
        </div>
      </header>

      <!-- Content Area -->
      <div class="p-6 space-y-5 w-full">
        <!-- Stat Cards Grid -->
        <div id="statsCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
          <div class="stat-card">
            <div class="spinner mx-auto"></div>
          </div>
        </div>

        <!-- Recent Activity Card -->
        <div class="card-minimal">
          <div class="px-4 py-3 border-b border-zinc-100 flex items-center justify-between">
            <div>
              <h3 class="text-xs font-semibold text-zinc-900">Recent Circulation Activity</h3>
              <p class="text-[11px] text-zinc-400 mt-0.5">Latest book loan and return events</p>
            </div>
            <a href="./pages/history.html" class="text-indigo-600 hover:text-indigo-700 text-[11px] font-semibold transition-colors">
              View All History →
            </a>
          </div>

          <div id="recentBorrowings" class="overflow-x-auto">
            <div class="text-center py-10"><div class="spinner mx-auto"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadDashboard);

    async function loadDashboard() {
      const result = await apiGet('/dashboard');

      if (!result.success) {
        showToast('Failed to load dashboard data', 'error');
        return;
      }

      const data = result.data;
      renderStatsCards(data);
      renderRecentBorrowings(data.recent_borrowings);
    }

    function renderStatsCards(data) {
      const container = document.getElementById('statsCards');
      const cards = [
        {
          title: 'Total Titles',
          value: Number(data.books.total_books || 0).toLocaleString(),
          subtitle: `${Number(data.books.total_copies || 0).toLocaleString()} copies in inventory`,
          colorClass: 'stat-card-indigo',
          iconBg: 'bg-indigo-50 text-indigo-600 border border-indigo-100/80',
          icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>`
        },
        {
          title: 'Available Copies',
          value: Number(data.books.available_copies || 0).toLocaleString(),
          subtitle: 'Available to borrow',
          colorClass: 'stat-card-emerald',
          iconBg: 'bg-emerald-50 text-emerald-600 border border-emerald-100/80',
          icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
        },
        {
          title: 'Registered Members',
          value: Number(data.total_members || 0).toLocaleString(),
          subtitle: 'Patrons & staff',
          colorClass: 'stat-card-violet',
          iconBg: 'bg-violet-50 text-violet-600 border border-violet-100/80',
          icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`
        },
        {
          title: 'Active Loans',
          value: Number((data.borrowings.active_borrowings || 0) + (data.borrowings.overdue_borrowings || 0)).toLocaleString(),
          subtitle: `${data.borrowings.overdue_borrowings || 0} overdue items`,
          colorClass: 'stat-card-amber',
          iconBg: 'bg-amber-50 text-amber-600 border border-amber-100/80',
          icon: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>`
        }
      ];

      container.innerHTML = cards.map(card => `
        <div class="stat-card ${card.colorClass}">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider block">${card.title}</span>
              <div class="stat-card-number">${card.value}</div>
              <span class="text-[11px] text-slate-400 mt-1 block">${card.subtitle}</span>
            </div>
            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${card.iconBg}">
              ${card.icon}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderRecentBorrowings(borrowings) {
      const container = document.getElementById('recentBorrowings');

      if (!borrowings || borrowings.length === 0) {
        container.innerHTML = '<div class="empty-state">No recent circulation records found</div>';
        return;
      }

      container.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 75px;">ID</th>
              <th>Member</th>
              <th>Borrow Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th class="text-right" style="width: 90px;">Action</th>
            </tr>
          </thead>
          <tbody>
            ${borrowings.map(b => {
              const isOverdue = b.status === 'Overdue';
              return `
                <tr>
                  <td>
                    <span class="px-2 py-0.5 rounded bg-slate-100/90 text-slate-600 font-mono text-[11px] font-semibold border border-slate-200/80">#${b.id}</span>
                  </td>
                  <td>
                    <div class="flex items-center gap-2.5">
                      ${getAvatarChip(`${b.first_name} ${b.last_name}`, b.member_code)}
                      <div>
                        <span class="font-semibold text-slate-800 text-xs block leading-tight">${b.first_name} ${b.last_name}</span>
                        <span class="text-[10.5px] text-slate-400 font-mono">${b.member_code}</span>
                      </div>
                    </div>
                  </td>
                  <td class="text-slate-500 text-xs">${formatDate(b.borrow_date)}</td>
                  <td class="text-xs ${isOverdue ? 'text-rose-600 font-semibold' : 'text-slate-600 font-medium'}">
                    ${isOverdue ? `<span class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>${formatDate(b.due_date)}</span>` : formatDate(b.due_date)}
                  </td>
                  <td>${getStatusBadge(b.status)}</td>
                  <td class="text-right">
                    <a href="./pages/history.html" class="btn-table-action">
                      Details <span>→</span>
                    </a>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
