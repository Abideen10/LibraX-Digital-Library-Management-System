<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraX - Book Details">
  <title>Book Detail | LibraX Digital Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar bg-slate-900 text-white flex-shrink-0 fixed lg:sticky top-0 h-screen overflow-y-auto z-40">
      <div class="p-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <div>
            <h1 class="text-lg font-bold">LibraX</h1>
            <p class="text-xs text-slate-400">Digital Library</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="../index.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="./books.html" class="sidebar-link active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Books
        </a>
        <a href="./members.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          Members
        </a>
        <a href="./borrow.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          Borrow & Return
        </a>
        <a href="./history.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          History
        </a>
      </nav>
    </aside>

    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-0">
      <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-4">
          <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="toggleSidebar()">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <a href="./books.html" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">← Back to Books</a>
        </div>
      </header>

      <div class="p-6">
        <div id="bookDetailPage" class="max-w-3xl">
          <div class="text-center py-12"><div class="spinner mx-auto"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    // ดึง book ID จาก URL parameter
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('id');

      if (!bookId) {
        document.getElementById('bookDetailPage').innerHTML = '<p class="text-center text-red-500">No book ID provided</p>';
        return;
      }

      const result = await apiGet(`/books/${bookId}`);

      if (!result.success || !result.data) {
        document.getElementById('bookDetailPage').innerHTML = '<p class="text-center text-red-500">Book not found</p>';
        return;
      }

      const book = result.data;
      document.title = `${book.title} | LibraX Digital Library`;

      document.getElementById('bookDetailPage').innerHTML = `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
          <div class="flex items-start justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">${book.title}</h1>
              <p class="text-slate-500 mt-1 text-lg">by ${book.author}</p>
            </div>
            ${getStatusBadge(book.status)}
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-6 mb-6">
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">ISBN</p>
              <p class="text-sm font-mono text-slate-700">${book.isbn}</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">Category</p>
              <p class="text-sm text-slate-700">${book.category}</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">Publisher</p>
              <p class="text-sm text-slate-700">${book.publisher || '-'}</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">Published Year</p>
              <p class="text-sm text-slate-700">${book.published_year || '-'}</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">Total Copies</p>
              <p class="text-sm text-slate-700">${book.quantity}</p>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium mb-1">Available</p>
              <p class="text-sm font-semibold ${book.available_quantity > 0 ? 'text-emerald-600' : 'text-red-500'}">${book.available_quantity}</p>
            </div>
          </div>

          ${book.description ? `
            <div class="border-t border-slate-100 pt-5">
              <p class="text-xs text-slate-400 font-medium mb-2">Description</p>
              <p class="text-sm text-slate-600 leading-relaxed">${book.description}</p>
            </div>
          ` : ''}

          <div class="border-t border-slate-100 pt-4 mt-5 text-xs text-slate-400">
            <p>Created: ${formatDate(book.created_at)} · Updated: ${formatDate(book.updated_at)}</p>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
