<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraX - Borrow & Return Books">
  <title>Borrow & Return | LibraX Digital Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar bg-slate-900 text-white flex-shrink-0 fixed lg:sticky top-0 h-screen overflow-y-auto z-40">
      <div class="p-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <div>
            <h1 class="text-lg font-bold">LibraX</h1>
            <p class="text-xs text-slate-400">Digital Library</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="../index.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="./books.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Books
        </a>
        <a href="./members.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          Members
        </a>
        <a href="./borrow.html" class="sidebar-link active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          Borrow & Return
        </a>
        <a href="./history.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          History
        </a>
      </nav>
    </aside>

    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-0">
      <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-4">
          <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="toggleSidebar()">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h2 class="text-xl font-semibold text-slate-800">Borrow & Return</h2>
        </div>
        <button class="btn btn-primary" onclick="openBorrowModal()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          New Borrowing
        </button>
      </header>

      <div class="p-6">
        <!-- Active Borrowings -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
          <div class="p-5 border-b border-slate-200">
            <h3 class="text-lg font-semibold text-slate-800">Active Borrowings</h3>
            <p class="text-sm text-slate-400 mt-1">Books currently borrowed and not yet returned</p>
          </div>
          <div id="activeBorrowingsContainer" class="overflow-x-auto">
            <div class="text-center py-12"><div class="spinner mx-auto"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Borrowing Modal -->
  <div id="borrowModal" class="modal-overlay" onclick="if(event.target===this)closeModal('borrowModal')">
    <div class="modal-content" style="max-width: 650px;">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-semibold text-slate-800">New Borrowing</h3>
        <button onclick="closeModal('borrowModal')" class="p-1 hover:bg-slate-100 rounded-lg">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="borrowForm" onsubmit="handleBorrowSubmit(event)">
        <div class="space-y-4">
          <!-- Member Selection -->
          <div>
            <label class="form-label">Select Member *</label>
            <select id="borrowMember" class="form-input" required>
              <option value="">-- Select Member --</option>
            </select>
          </div>

          <!-- Book Selection -->
          <div>
            <label class="form-label">Select Books *</label>
            <div class="border border-slate-200 rounded-lg p-3 max-h-48 overflow-y-auto" id="bookCheckboxList">
              <p class="text-sm text-slate-400">Loading books...</p>
            </div>
          </div>

          <!-- Dates -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label">Borrow Date *</label>
              <input type="date" id="borrowDate" class="form-input" required>
            </div>
            <div>
              <label class="form-label">Due Date *</label>
              <input type="date" id="dueDate" class="form-input" required>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-5">
          <button type="button" class="btn btn-secondary" onclick="closeModal('borrowModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Borrowing</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Borrowing Detail Modal -->
  <div id="borrowDetailModal" class="modal-overlay" onclick="if(event.target===this)closeModal('borrowDetailModal')">
    <div class="modal-content" style="max-width: 650px;">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-semibold text-slate-800">Borrowing Details</h3>
        <button onclick="closeModal('borrowDetailModal')" class="p-1 hover:bg-slate-100 rounded-lg">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="borrowDetailContent"></div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/borrow.js"></script>
</body>
</html>
