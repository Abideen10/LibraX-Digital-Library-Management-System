<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraX - Member Management - Manage library members">
  <title>Members | LibraX Digital Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-100">
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar bg-slate-900 text-white flex-shrink-0 fixed lg:sticky top-0 h-screen overflow-y-auto z-40">
      <div class="p-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <div>
            <h1 class="text-lg font-bold">LibraX</h1>
            <p class="text-xs text-slate-400">Digital Library</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="../index.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="./books.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Books
        </a>
        <a href="./members.html" class="sidebar-link active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          Members
        </a>
        <a href="./borrow.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          Borrow & Return
        </a>
        <a href="./history.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          History
        </a>
      </nav>
    </aside>

    <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-0">
      <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-4">
          <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="toggleSidebar()">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h2 class="text-xl font-semibold text-slate-800">Members Management</h2>
        </div>
        <button class="btn btn-primary" onclick="openAddMemberModal()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add Member
        </button>
      </header>

      <div class="p-6">
        <!-- Search & Filter -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-5">
          <div class="search-bar">
            <div class="flex-1 min-w-[200px]">
              <input type="text" id="searchInput" placeholder="Search by name, code, or email..." class="form-input" oninput="handleSearch()">
            </div>
            <select id="typeFilter" class="form-input w-auto" onchange="handleSearch()">
              <option value="">All Types</option>
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
        </div>

        <!-- Members Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
          <div id="membersTableContainer" class="overflow-x-auto">
            <div class="text-center py-12"><div class="spinner mx-auto"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Member Modal -->
  <div id="memberModal" class="modal-overlay" onclick="if(event.target===this)closeModal('memberModal')">
    <div class="modal-content">
      <div class="flex items-center justify-between mb-5">
        <h3 id="memberModalTitle" class="text-lg font-semibold text-slate-800">Add New Member</h3>
        <button onclick="closeModal('memberModal')" class="p-1 hover:bg-slate-100 rounded-lg">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="memberForm" onsubmit="handleMemberSubmit(event)">
        <input type="hidden" id="memberId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Member Code *</label>
            <input type="text" id="memberCode" class="form-input" placeholder="e.g. STD-2024-005" required>
          </div>
          <div>
            <label class="form-label">Member Type *</label>
            <select id="memberType" class="form-input" required>
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
          <div>
            <label class="form-label">First Name *</label>
            <input type="text" id="memberFirstName" class="form-input" required>
          </div>
          <div>
            <label class="form-label">Last Name *</label>
            <input type="text" id="memberLastName" class="form-input" required>
          </div>
          <div>
            <label class="form-label">Email *</label>
            <input type="email" id="memberEmail" class="form-input" required>
          </div>
          <div>
            <label class="form-label">Phone</label>
            <input type="text" id="memberPhone" class="form-input">
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-5">
          <button type="button" class="btn btn-secondary" onclick="closeModal('memberModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="memberSubmitBtn">Add Member</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Member Borrowings Modal -->
  <div id="memberBorrowingsModal" class="modal-overlay" onclick="if(event.target===this)closeModal('memberBorrowingsModal')">
    <div class="modal-content" style="max-width: 700px;">
      <div class="flex items-center justify-between mb-5">
        <h3 id="memberBorrowingsTitle" class="text-lg font-semibold text-slate-800">Borrowing History</h3>
        <button onclick="closeModal('memberBorrowingsModal')" class="p-1 hover:bg-slate-100 rounded-lg">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="memberBorrowingsContent"></div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/members.js"></script>
</body>
</html>
